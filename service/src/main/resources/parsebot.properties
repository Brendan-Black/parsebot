# ParseBot Configuration

# How often to poll for new data (seconds)
poll.interval.seconds=60

# Mail settings (IMAP)
mail.host=
mail.port=993
mail.username=
mail.password=
mail.folder=INBOX
mail.folder.success=Processed
mail.folder.failed=Failed
mail.protocol=imaps

# Claude API
claude.api.key=

# CSV reference data
csv.customers=
csv.products=

# Custom per-sender overrides
# Files named by sender email (person@place.com) or wildcard (*@place.com)
custom.rules.dir=custom_rules
custom.productlists.dir=custom_productlists

# SFTP output
sftp.host=
sftp.port=22
sftp.username=
sftp.password=
sftp.private.key=
sftp.remote.directory=/upload

# Events & tracking
events.consecutive.failure.threshold=3
events.report.schedule=daily
events.report.time=08:00

# Notifications - Email (SMTP) for non-critical events
# Uses mail.username/password from IMAP settings for authentication and from address
notify.smtp.enabled=false
notify.smtp.host=
notify.smtp.port=587
notify.smtp.to=
notify.smtp.to.urgent=
notify.smtp.starttls=true

# Notifications - Microsoft Teams webhook for critical events
notify.teams.enabled=false
notify.teams.webhook.url=


