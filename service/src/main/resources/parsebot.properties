# ParseBot Configuration

# How often to poll for new data (seconds)
poll.interval.seconds=60

# Mail settings (IMAP)
mail.host=
mail.port=993
mail.username=
mail.password=
mail.folder=INBOX
mail.folder.success=Processed
mail.folder.failed=Failed
mail.protocol=imaps

# Claude API
claude.api.key=

# CSV reference data
csv.customers=
csv.products=

# Custom per-sender overrides
# Files named by sender email (person@place.com) or wildcard (*@place.com)
custom.rules.dir=custom_rules
custom.productlists.dir=custom_productlists

# SFTP output
sftp.host=
sftp.port=22
sftp.username=
sftp.password=
sftp.private.key=
sftp.remote.directory=/upload

