# ParseBot Configuration

# How often to poll for new data (seconds)
poll.interval.seconds=60

# Local file system input
input.directory=./input
input.file.pattern=*.txt

# Mail settings (IMAP)
mail.host=
mail.port=993
mail.username=
mail.password=
mail.folder=INBOX
mail.folder.success=Processed
mail.folder.failed=Failed
mail.protocol=imaps

# SFTP output
sftp.host=
sftp.port=22
sftp.username=
sftp.password=
sftp.private.key=
sftp.remote.directory=/upload
